<style>.f{opacity:0;animation:in .6s ease-out forwards}
.seg{opacity:0;animation:seg .25s ease-out forwards}
.blink{animation:bl 1.1s steps(1) infinite}
.pulse{animation:pu 2s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes seg{to{opacity:1}}
@keyframes bl{50%{opacity:0}}
@keyframes pu{50%{opacity:.3}}
@keyframes mqx{to{transform:translateX(-2203px)}}.mq{animation:mqx 45s linear infinite}
@media (prefers-reduced-motion:reduce){.f,.seg{animation:none;opacity:1}.blink,.pulse,.mq,.run{animation:none}}</style>
